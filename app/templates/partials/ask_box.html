{# needs: ask_label, ask_scope #}
<section class="space-y-2">
  <form hx-post="/ask" hx-target="next .answer" hx-indicator="next .thinking" hx-disabled-elt="find button"
        class="flex gap-2">
    <input type="hidden" name="scope" value="{{ ask_scope }}">
    <input name="q" required maxlength="300" placeholder="{{ ask_label }}"
           class="flex-1 min-w-0 rounded-lg border border-slate-300 px-3 py-2 text-sm">
    <button class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm disabled:opacity-50">Ask</button>
  </form>
  <p class="thinking htmx-indicator text-xs text-slate-500">Reading your documents…</p>
  <div class="answer"></div>
</section>
