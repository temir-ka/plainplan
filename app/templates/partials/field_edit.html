{# needs: f #}
<form id="field-{{ f.id }}" hx-post="/fields/{{ f.id }}" hx-target="this" hx-swap="outerHTML" class="fact glass">
  <label class="field" for="fv-{{ f.id }}"><span>{{ f.name.replace("_", " ").capitalize() }}</span></label>
  <div class="ask__row">
    <input id="fv-{{ f.id }}" class="input" name="value" value="{{ f.value }}" maxlength="120" autofocus>
    <button class="btn btn--dark" type="submit">Save</button>
  </div>
  <div class="between">
    <p class="muted small">Your value replaces the document quote and is marked “Entered by you”.</p>
    <button class="linkbtn" type="button" hx-get="/fields/{{ f.id }}" hx-target="#field-{{ f.id }}" hx-swap="outerHTML">Cancel</button>
  </div>
</form>
