{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block content %}
<div class="container stack page-top narrow">
  <a class="back" href="/">{{ icon('back', 18) }}Family</a>
  <section class="glass pad stack stack--sm">
    <h1 class="hd big">Delete my family data</h1>
    <p class="muted">This removes your family members, policies and all text we stored from your documents. It cannot be undone.</p>
    <form method="post" action="/delete-data"><button class="btn btn--danger" type="submit">Delete everything</button></form>
  </section>
</div>
{% endblock %}
