<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plainplan{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/" class="font-bold text-lg tracking-tight">Plainplan</a>
      <div class="flex items-center gap-2 text-sm">
        <span class="font-medium">{{ household.name }}</span>
        {% if household.is_demo %}
          <span class="rounded-full bg-amber-100 text-amber-800 px-2 py-0.5 text-xs">Demo</span>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="max-w-2xl mx-auto px-4 py-4 text-xs text-slate-500 space-y-2">
      <p>Plainplan explains your own policy documents. It is not insurance, legal, or medical advice and does not
        sell insurance. Your insurer makes the final decision on any claim.</p>
    </div>
  </footer>
</body>
</html>
