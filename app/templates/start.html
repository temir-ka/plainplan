{% extends "base.html" %}
{% block content %}
  <h1 class="text-2xl font-semibold">Start my own family</h1>
  <p class="text-sm text-slate-600">No account needed. Your family is saved in this browser.
    Members are a nickname and a role only.</p>
  <form method="post" action="/start" class="space-y-3">
    <input name="name" placeholder="Family name, e.g. The Smiths" maxlength="40"
           class="w-full rounded-lg border border-slate-300 px-3 py-2">
    <button class="w-full rounded-lg bg-slate-900 text-white py-2">Create my family</button>
  </form>
{% endblock %}
