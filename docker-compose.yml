services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8000}:8000"   # only from the server itself; the world comes through Caddy
    env_file: .env                    # lives only on the server, never in git
    environment:
      DATABASE_URL: sqlite:////data/plainplan.db
    volumes:
      - plainplan-data:/data          # survives rebuilds and restarts
    mem_limit: 450m                   # 1 GB server: if we misbehave, only this container is killed
    logging:
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"                       # needed for the Let's Encrypt check and the http -> https redirect
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. 206-81-28-155.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # certificates: keep them, or Let's Encrypt rate limits may bite
      - caddy-config:/config
    mem_limit: 100m
    logging:
      options: {max-size: "10m", max-file: "3"}

volumes:
  plainplan-data:
  caddy-data:
  caddy-config:
