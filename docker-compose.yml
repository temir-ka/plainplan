services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env            # lives only on the server, never in git
    environment:
      DATABASE_URL: sqlite:////data/plainplan.db
    volumes:
      - plainplan-data:/data  # survives rebuilds and restarts

volumes:
  plainplan-data:
